<app-install-modal [state]="installModal()" (closed)="closeInstallModal()" />

<app-app-header [activeVersion]="activeVersion()" />

<main class="main">
  <app-status-card />

  <app-action-card
    [isLoading]="isLoading()"
    [prefillVersion]="prefillVersion()"
    (install)="onInstall($event)"
    (use)="onUse($event)"
    (setDefault)="onSetDefault($event)"
    (uninstall)="onUninstall($event)"
  />

  <app-installed-versions-card
    [versions]="installedVersions()"
    [raw]="installedRaw()"
    [loading]="installedLoading()"
    [isLoading]="isLoading()"
    (useVersion)="onUseFromList($event)"
    (refresh)="loadInstalledVersions()"
  />

  <app-aliases-card
    [refreshTrigger]="aliasesRefreshTrigger()"
    [installedVersions]="installedVersions()"
    (logged)="onLogged($event)"
    (aliasChanged)="loadInstalledVersions()"
  />

  <app-remote-versions-card
    [installedVersions]="installedVersions()"
    [isLoading]="isLoading()"
    (install)="onInstall($event)"
    (logged)="onLogged($event)"
  />

  <app-log-card [log]="log()" />
</main>
