<app-install-modal [state]="state.installModal()" (closed)="state.closeInstallModal()" />

<app-app-header [activeVersion]="state.activeVersion()" />

<main class="main">
  <app-status-card (nvmUpdate)="state.onNvmUpdate($event)" />

  <app-action-card
    [isLoading]="state.isLoading()"
    [prefillVersion]="state.prefillVersion()"
    (install)="state.onInstall($event)"
    (use)="state.onUse($event)"
    (setDefault)="state.onSetDefault($event)"
    (uninstall)="state.onUninstall($event)"
  />

  <app-installed-versions-card
    [versions]="state.installedVersions()"
    [raw]="state.installedRaw()"
    [loading]="state.installedLoading()"
    [isLoading]="state.isLoading()"
    (useVersion)="state.onUseFromList($event)"
    (uninstallVersion)="state.onUninstall($event)"
    (refresh)="state.loadInstalledVersions()"
  />

  <app-aliases-card
    [refreshTrigger]="state.aliasesRefreshTrigger()"
    [installedVersions]="state.installedVersions()"
    (logged)="state.onLogged($event)"
    (aliasChanged)="state.loadInstalledVersions()"
  />

  <app-remote-versions-card
    [installedVersions]="state.installedVersions()"
    [isLoading]="state.isLoading()"
    (install)="state.onInstall($event)"
    (logged)="state.onLogged($event)"
  />

  <app-log-card [log]="state.log()" />
</main>

<app-app-footer />
