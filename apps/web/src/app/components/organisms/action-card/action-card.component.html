<app-card>
  <span card-title>Aktion</span>

  <div class="action-form">
    <div class="input-group">
      <label class="input-group__label" for="versionInput">Version</label>
      <input
        id="versionInput"
        class="input"
        type="text"
        [(ngModel)]="versionInput"
        placeholder="z.B. 22, 22.11, lts/*, node"
        [disabled]="isLoading()"
      />
      <span class="input-group__hint">Erlaubt: node, stable, lts/*, 22, 22.11, 22.11.0</span>
    </div>
    <div class="action-buttons">
      <button class="btn btn--primary" (click)="onInstall()" [disabled]="isLoading()">
        @if (isLoading()) { Bitte warten ... } @else { Installieren }
      </button>
      <button class="btn btn--secondary" (click)="onUse()" [disabled]="isLoading()">
        Verwenden
      </button>
      <button class="btn btn--secondary" (click)="onSetDefault()" [disabled]="isLoading()">
        Als Default setzen
      </button>
      <button class="btn btn--danger" (click)="onUninstall()" [disabled]="isLoading()">
        Deinstallieren
      </button>
    </div>
  </div>
  <div class="notice">
    <strong>Hinweis:</strong> <em>nvm use</em> gilt nur für die Shell-Session des
    Backend-Prozesses und verändert nicht bereits geöffnete Terminals.
    Für neue Terminals bitte die Default-Version setzen.
  </div>
</app-card>
